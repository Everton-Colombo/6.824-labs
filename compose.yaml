name: mc714

services:
  node0:
    build: .
    container_name: kvraft-node0
    environment:
      NODE_ID: "0"
      PEERS: "node0:8000,node1:8000,node2:8000"
      RAFT_ADDR: ":8000"
      HTTP_ADDR: ":9000"
      DATA_DIR: "/data"
      MAX_RAFT_STATE: "4096"
    ports:
      - "9000:9000"
    volumes:
      - node0-data:/data
    cap_add:
      - NET_ADMIN
    networks:
      - raftnet

  node1:
    build: .
    container_name: kvraft-node1
    environment:
      NODE_ID: "1"
      PEERS: "node0:8000,node1:8000,node2:8000"
      RAFT_ADDR: ":8000"
      HTTP_ADDR: ":9000"
      DATA_DIR: "/data"
      MAX_RAFT_STATE: "4096"
    ports:
      - "9001:9000"
    volumes:
      - node1-data:/data
    cap_add:
      - NET_ADMIN
    networks:
      - raftnet

  node2:
    build: .
    container_name: kvraft-node2
    environment:
      NODE_ID: "2"
      PEERS: "node0:8000,node1:8000,node2:8000"
      RAFT_ADDR: ":8000"
      HTTP_ADDR: ":9000"
      DATA_DIR: "/data"
      MAX_RAFT_STATE: "4096"
    ports:
      - "9002:9000"
    volumes:
      - node2-data:/data
    cap_add:
      - NET_ADMIN
    networks:
      - raftnet

volumes:
  node0-data:
  node1-data:
  node2-data:

networks:
  raftnet:
    driver: bridge
