      HTTP_ADDR: ":9000"
      DATA_DIR: "/data"
      MAX_RAFT_STATE: "4096"
    ports:
      - "9002:9000"
    volumes:
      - node2-data:/data
    cap_add:
      - NET_ADMIN
    networks:
      - raftnet

  node3:
    build:
      context: ../..
