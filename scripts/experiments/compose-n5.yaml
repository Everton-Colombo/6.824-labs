name: mc714-n5

services:
  node0:
    build:
      context: ../..
    container_name: kvraft-n5-node0
    environment:
      NODE_ID: "0"
      PEERS: "kvraft-n5-node0:8000,kvraft-n5-node1:8000,kvraft-n5-node2:8000,kvraft-n5-node3:8000,kvraft-n5-node4:8000"
      RAFT_ADDR: ":8000"
      HTTP_ADDR: ":9000"
      DATA_DIR: "/data"
      MAX_RAFT_STATE: "4096"
    ports:
      - "9000:9000"
    volumes:
      - node0-data:/data
    cap_add:
      - NET_ADMIN
    networks:
      - raftnet

  node1:
    build:
      context: ../..
    container_name: kvraft-n5-node1
